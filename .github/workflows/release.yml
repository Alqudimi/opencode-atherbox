name: Release archive
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create archive and checksum
        run: |
          git archive --format=tar.gz --prefix=opencode-atherbox/ -o opencode-atherbox.tar.gz HEAD
          sha256sum opencode-atherbox.tar.gz > opencode-atherbox.tar.gz.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opencode-atherbox.tar.gz
            opencode-atherbox.tar.gz.sha256
